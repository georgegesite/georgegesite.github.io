<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>For Flora Mae</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;600&family=EB+Garamond:ital,wght@0,400;0,500;1,400&family=Cormorant+Garamond:ital@1&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- ambient drifting light, purely decorative -->
  <div class="haze" aria-hidden="true"></div>

  <!-- STAGE ONE: the closed envelope -->
  <main id="envelope-stage" class="stage">
    <button id="envelope" class="envelope" aria-label="Open the letter">
      <span class="envelope__shadow" aria-hidden="true"></span>
      <span class="envelope__back" aria-hidden="true"></span>
      <span class="envelope__flap" aria-hidden="true"></span>
      <span class="envelope__body" aria-hidden="true"></span>
      <span class="envelope__seal" aria-hidden="true">Moon</span>
      <span class="envelope__label">
        <span class="envelope__to"></span>
        <span class="envelope__name">Flora Mae</span>
      </span>
    </button>
    <p class="stage__hint">tap the seal to open</p>
  </main>

  <!-- STAGE TWO: the unfolded letter -->
  <section id="letter-stage" class="stage stage--letter" aria-hidden="true">
    <article class="letter">
      <header class="letter__head">
        <p class="letter__place-date" id="letter-date"></p>
      </header>

      <p class="letter__recipient" id="letter-recipient"></p>

      <div class="letter__body" id="letter-body"></div>

      <footer class="letter__sign" id="letter-sign">
        <p class="letter__closing" id="letter-closing"></p>
        <p class="letter__signature" id="letter-signature"></p>
      </footer>
    </article>
  </section>

  <script src="data.js"></script>
  <script src="script.js"></script>
</body>
</html>
