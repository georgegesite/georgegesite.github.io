<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>For Flora Mae</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;600&family=EB+Garamond:ital,wght@0,400;0,500;1,400&family=Cormorant+Garamond:ital@1&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- ambient drifting light, purely decorative -->
  <div class="haze" aria-hidden="true"></div>

  <!-- STAGE ONE: the closed envelope -->
  <main id="envelope-stage" class="stage">
    <div class="envelope-scene">

      <!-- decorative flower sprigs, purely visual -->
      <svg class="flower flower--left flower--wine" viewBox="0 0 70 110" aria-hidden="true">
        <path class="flower__stem" d="M35 108 C33 80 45 66 38 44" />
        <path class="flower__leaf" d="M37 78 C24 74 20 62 30 62 C37 66 38 72 37 78 Z" />
        <g class="flower__head" transform="translate(36 26)">
          <ellipse class="flower__petal" rx="7" ry="13" transform="rotate(0)" />
          <ellipse class="flower__petal" rx="7" ry="13" transform="rotate(72)" />
          <ellipse class="flower__petal" rx="7" ry="13" transform="rotate(144)" />
          <ellipse class="flower__petal" rx="7" ry="13" transform="rotate(216)" />
          <ellipse class="flower__petal" rx="7" ry="13" transform="rotate(288)" />
          <circle class="flower__center" r="5" />
        </g>
      </svg>

      <svg class="flower flower--right flower--gold" viewBox="0 0 70 110" aria-hidden="true">
        <path class="flower__stem" d="M35 108 C37 78 26 64 33 42" />
        <path class="flower__leaf" d="M33 76 C46 71 50 60 40 60 C33 64 32 70 33 76 Z" />
        <g class="flower__head" transform="translate(34 24)">
          <ellipse class="flower__petal" rx="6.5" ry="12" transform="rotate(0)" />
          <ellipse class="flower__petal" rx="6.5" ry="12" transform="rotate(72)" />
          <ellipse class="flower__petal" rx="6.5" ry="12" transform="rotate(144)" />
          <ellipse class="flower__petal" rx="6.5" ry="12" transform="rotate(216)" />
          <ellipse class="flower__petal" rx="6.5" ry="12" transform="rotate(288)" />
          <circle class="flower__center" r="4.5" />
        </g>
      </svg>

      <svg class="flower flower--small flower--rose" viewBox="0 0 70 110" aria-hidden="true">
        <path class="flower__stem" d="M35 108 C36 90 30 80 34 64" />
        <path class="flower__leaf" d="M33 88 C22 85 19 76 27 76 C32 79 33 84 33 88 Z" />
        <g class="flower__head" transform="translate(34 50)">
          <ellipse class="flower__petal" rx="5" ry="9" transform="rotate(0)" />
          <ellipse class="flower__petal" rx="5" ry="9" transform="rotate(72)" />
          <ellipse class="flower__petal" rx="5" ry="9" transform="rotate(144)" />
          <ellipse class="flower__petal" rx="5" ry="9" transform="rotate(216)" />
          <ellipse class="flower__petal" rx="5" ry="9" transform="rotate(288)" />
          <circle class="flower__center" r="3.5" />
        </g>
      </svg>

      <button id="envelope" class="envelope" aria-label="Open the letter">
        <span class="envelope__shadow" aria-hidden="true"></span>
        <span class="envelope__back" aria-hidden="true"></span>
        <span class="envelope__flap" aria-hidden="true"></span>
        <span class="envelope__body" aria-hidden="true"></span>
        <span class="envelope__seal" aria-hidden="true">Moon</span>
        <span class="envelope__label">
          <span class="envelope__to"></span>
          <span class="envelope__name">Flora Mae</span>
        </span>
      </button>
    </div>
    <p class="stage__hint">tap the seal to open</p>
  </main>

  <!-- STAGE TWO: the unfolded letter -->
  <section id="letter-stage" class="stage stage--letter" aria-hidden="true">
    <article class="letter">
      <header class="letter__head">
        <p class="letter__place-date" id="letter-date"></p>
      </header>

      <p class="letter__recipient" id="letter-recipient"></p>

      <div class="letter__body" id="letter-body"></div>

      <footer class="letter__sign" id="letter-sign">
        <p class="letter__closing" id="letter-closing"></p>
        <p class="letter__signature" id="letter-signature"></p>
      </footer>
    </article>
  </section>

  <script src="data.js"></script>
  <script src="script.js"></script>
</body>
</html>
